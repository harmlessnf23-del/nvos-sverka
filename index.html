<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Сверка ДПНВОС, реестра ОНВОС и ДВОС по выбросам и сбросам с отчётом в Excel. Файлы обрабатываются в браузере.">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Сверка НВОС</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: в духе системных интерфейсов macOS/iOS — матовая шапка, крупный заголовок, сегментированные переключатели, белые карточки на сером фоне, синий акцент */
:root{
  --bg:#F5F5F7; --surface:#FFFFFF; --surface-2:#EDEDF0; --fg:#1D1D1F; --muted:#6E6E73; --faint:#86868B; --line:#E5E5EA; --line-2:#D2D2D7;
  --accent:#0071E3; --accent-fg:#FFFFFF; --accent-soft:#E8F2FD;
  --err:#D70015; --err-soft:#FFEBEC; --warn:#B25000; --warn-soft:#FFF4E5; --ok:#1E8E3E; --ok-soft:#E8F6EC; --skip:#6E6E73; --skip-soft:#F0F0F2;
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Helvetica Neue",Arial,sans-serif;
  --f-mono:"SF Mono",ui-monospace,Menlo,"JetBrains Mono",Consolas,monospace;
  --shadow:0 1px 1px rgba(0,0,0,.02),0 4px 18px rgba(0,0,0,.05);
  --r:20px; --r-s:10px;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.5;letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;text-wrap:balance}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
svg{flex:none}

/* ---------- шапка ---------- */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:rgba(251,251,253,.8);backdrop-filter:saturate(1.8) blur(20px);-webkit-backdrop-filter:saturate(1.8) blur(20px);border-bottom:1px solid rgba(0,0,0,.08)}
.hdr-in{max-width:1180px;margin:0 auto;padding:10px 32px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(180deg,#34C759,#1E9E45);color:#fff;display:grid;place-items:center}
.brand b{font-size:15px;font-weight:600;letter-spacing:-.01em}
.brand .sub{color:var(--faint);font-size:13px;padding-left:10px;border-left:1px solid var(--line-2)}
.hdr-note{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.hdr-note svg{color:var(--accent)}

.wrap{max-width:1180px;margin:0 auto;padding-inline:32px;padding-block:48px 88px;display:flex;flex-direction:column;gap:40px}
.intro{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.crumb{font-size:15px;color:var(--faint);font-weight:500;display:flex;gap:6px;align-items:center;margin-bottom:6px}
.crumb i{font-style:normal;color:var(--faint)}
.intro h1{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* ---------- строка управления ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;background:var(--surface);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.tgroup{display:flex;align-items:center;gap:10px}
.tlabel{font-size:12.5px;color:var(--muted)}
.seg,.cats{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 14px;border-radius:7px;cursor:pointer;font-weight:500;color:var(--muted);display:inline-flex;align-items:center;gap:7px;font-size:13.5px}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
.seg button[aria-pressed="true"] svg{color:var(--accent)}
.cat{border:0;background:transparent;border-radius:7px;padding:5px 14px;cursor:pointer;display:inline-flex;align-items:baseline;gap:5px;font-size:13.5px;color:var(--muted);font-weight:500}
.cat b{font-weight:600}
.cat small{font-size:12.5px}
.cat:hover{color:var(--fg)}
.cat[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
.cat .stubdot{font-size:11px;color:var(--faint)}
.params{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;margin-left:auto}
.pf{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.pf select,.pf input{border:0;background:var(--surface-2);border-radius:8px;padding:6px 10px;font-size:13.5px;color:var(--fg)}
.pf select#p-year{font-weight:600}
.pf input{width:110px;font-variant-numeric:tabular-nums}
.pwarn{font-size:12px;color:var(--warn);background:var(--warn-soft);padding:3px 9px;border-radius:999px}
.toolbar-note{flex-basis:100%;font-size:12.5px;color:var(--faint);margin-top:-2px}
@media (max-width:900px){.params{margin-left:0}}

.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.sec-h h2{font-size:24px;font-weight:700;letter-spacing:-.02em}
.sec-h span{font-size:13px;color:var(--muted)}

/* ---------- кнопки ---------- */
.btn{border:0;background:var(--surface);padding:8px 16px;border-radius:999px;box-shadow:0 0 0 1px var(--line-2) inset;color:var(--accent);cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:7px;font-size:13.5px}
.btn:hover{background:var(--accent-soft)}
.btn.primary{background:var(--accent);color:#fff;box-shadow:none;padding:9px 20px;font-weight:500}
.btn.primary:hover{background:#0077ED}
.btn.small{padding:5px 11px;font-size:13px}
.btn.ghost{box-shadow:none;background:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- документы ---------- */
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.slot{background:var(--surface);border:0;border-radius:var(--r);padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;min-width:0}
.slot.drag{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.slot-h{display:flex;align-items:flex-start;gap:12px}
.step{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;background:var(--surface-2);color:var(--muted);flex:none;margin-top:1px}
.step.ok{background:#34C759;color:#fff}
.step.bad{background:var(--err-soft);color:var(--err)}
.step.load{background:var(--accent-soft);color:var(--accent)}
.slot-t{min-width:0;flex:1;display:flex;flex-direction:column}
.slot-t b{font-size:19px;font-weight:600;letter-spacing:-.02em}
.slot-t small{color:var(--muted);font-size:12.5px;line-height:1.35}
.chip{font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;white-space:nowrap;color:var(--muted);background:var(--surface-2)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--err-soft);color:var(--err)}
.chip.load{background:var(--accent-soft);color:var(--accent)}
.shared{font-size:12px;color:var(--faint)}
.drop{border:1.5px dashed var(--line-2);border-radius:14px;background:#FAFAFC;padding:28px 12px;text-align:center;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.drop:hover{border-color:var(--accent);color:var(--fg);background:var(--accent-soft)}
.drop svg{color:var(--accent)}
.drop:hover svg{color:var(--accent)}
.drop u{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:3px}
.drop small{display:block;font-size:12px;color:var(--faint)}
.file{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.file .name{font-weight:500;word-break:break-all;min-width:0;display:flex;gap:8px;align-items:center;font-size:13.5px}
.file .name svg{color:var(--muted)}
.badge{font-size:11px;font-weight:500;padding:1px 8px;border-radius:999px;background:var(--warn-soft);color:var(--warn);white-space:nowrap}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);align-items:center}
.meta label{display:inline-flex;gap:6px;align-items:center}
.meta select,.meta input{border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:3px 6px;font-size:12.5px;max-width:160px}
.meta input{width:56px}
.mapstate{font-size:12.5px;display:flex;gap:7px;align-items:center;color:var(--muted)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:none}
.dot.bad{background:var(--err)}
.prog{display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--muted)}
.prog .track{height:5px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.prog .fill{height:100%;background:var(--accent);width:0;border-radius:999px;transition:width .25s}
.errbox{background:var(--err-soft);color:var(--err);border-radius:var(--r-s);padding:9px 11px;font-size:13px}
details{border-top:1px solid var(--line);padding-top:12px}
summary{cursor:pointer;font-size:13px;color:var(--muted);font-weight:500;list-style:none;display:flex;align-items:center;gap:6px}
summary::-webkit-details-marker{display:none}
summary::before{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .15s;margin-right:2px}
details[open]>summary::before{transform:rotate(45deg)}
summary:hover{color:var(--fg)}
.maptbl{width:100%;border-collapse:collapse;margin-top:8px;font-size:12.5px}
.maptbl td{padding:3px 0;vertical-align:middle}
.maptbl td:first-child{padding-right:8px;color:var(--muted)}
.maptbl select{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:4px 6px;font-size:12.5px}
.maptbl select.unset{border-color:var(--err)}
.req{color:var(--err)}
.scroll{overflow-x:auto;margin-top:8px;border:1px solid var(--line);border-radius:var(--r-s)}
.prev{border-collapse:collapse;font-size:11.5px;font-family:var(--f-mono);white-space:nowrap}
.prev th,.prev td{padding:4px 8px;border-bottom:1px solid var(--line);text-align:left;max-width:240px;overflow:hidden;text-overflow:ellipsis}
.prev th{background:var(--surface-2);font-weight:500}
.stub{background:var(--surface);border:1.5px dashed var(--line-2);border-radius:var(--r);padding:44px;text-align:center;color:var(--muted)}
.stub b{color:var(--fg);display:block;font-size:16px;margin-bottom:4px;font-weight:600}

/* ---------- отчёт ---------- */
.report{display:flex;flex-direction:column;gap:20px;min-width:0}
.rep-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-end}
.rep-h h2{font-size:28px;font-weight:700;letter-spacing:-.025em}
.stale{background:var(--warn-soft);color:var(--warn);padding:10px 14px;border-radius:var(--r-s);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{display:flex;flex-direction:column;gap:4px;padding:18px 20px;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);min-width:0}
.stat span{font-size:12.5px;color:var(--muted);order:-1}
.stat b{font-size:30px;font-weight:600;line-height:1.15;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat.err b{color:var(--err)}
.stat.warn b{color:var(--warn)}
.stat.ok b{color:var(--ok)}
.panel{background:var(--surface);box-shadow:var(--shadow);border-radius:var(--r);overflow:hidden;min-width:0}
.rules{display:flex;flex-direction:column;background:var(--surface);box-shadow:var(--shadow);border-radius:var(--r);overflow:hidden}
.rule{display:grid;grid-template-columns:96px 1fr auto;gap:14px;padding:12px 20px;align-items:center;border-top:1px solid var(--line);font-size:13.5px}
.rule:first-child{border-top:0}
.rule .rid{font-size:12.5px;color:var(--faint);font-weight:500;font-variant-numeric:tabular-nums}
.rule .rt{min-width:0}
.rule .rt small{display:block;color:var(--muted);font-size:12px}
.tech{border-top:1px solid var(--line);padding:0}
.tech>summary{padding:12px 20px}
.tech[open]>summary{border-bottom:1px solid var(--line)}
.tech .rule{background:var(--bg)}
.draft{font-size:10.5px;font-weight:500;color:var(--muted);border:1px solid var(--line-2);border-radius:4px;padding:0 5px;margin-left:6px;white-space:nowrap}
.pill{font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;white-space:nowrap;display:inline-block}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.fail{background:var(--err-soft);color:var(--err)}
.pill.warnp{background:var(--warn-soft);color:var(--warn)}
.pill.skip{background:var(--skip-soft);color:var(--skip)}
@media (max-width:600px){.rule{grid-template-columns:1fr auto}.rule .rid{grid-column:1/-1}}
.tabs{display:inline-flex;align-self:flex-start;background:var(--surface-2);border-radius:9px;padding:2px;gap:2px}
.tabs button{border:0;background:transparent;padding:6px 16px;cursor:pointer;font-weight:500;color:var(--muted);border-radius:7px;font-size:13.5px}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected="true"]{color:var(--fg);background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters select,.filters input[type=search]{border:0;background:var(--surface);box-shadow:0 0 0 1px var(--line) inset;border-radius:10px;padding:8px 11px;font-size:13px;min-width:0}
.filters input[type=search]{flex:1;min-width:180px}
.filters label{font-size:13px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.ftbl{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
.ftbl th,.ftbl td{padding:11px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.ftbl tbody tr:last-child td{border-bottom:0}
.ftbl th{font-size:12px;color:var(--faint);font-weight:600;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);position:sticky;top:0;z-index:1;white-space:nowrap;box-shadow:inset 0 -1px 0 var(--line)}
.ftbl tbody tr:hover td{background:#FAFAFC}
.ftbl td.sev{white-space:nowrap;font-weight:500;font-size:12.5px}
.ftbl td.sev::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:7px;vertical-align:2px}
.ftbl tr.error td.sev{color:var(--err)} .ftbl tr.error td.sev::before{background:var(--err)}
.ftbl tr.warning td.sev{color:var(--warn)} .ftbl tr.warning td.sev::before{background:var(--warn)}
.ftbl .num{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:12.5px}
.ftbl td.v{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right;font-size:12.5px}
.ftbl td.v.miss{color:var(--err);font-family:var(--f-ui);text-align:center;font-weight:500}
.ftbl td.v.miss span{background:var(--err-soft);padding:1px 8px;border-radius:999px;font-size:12px}
.ftbl td.v.na{color:var(--faint);text-align:center}
.ftbl .obj{font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:500;white-space:nowrap}
.ftbl .obj small{display:block;color:var(--muted)}
.ftbl .zv small{display:block;color:var(--muted);font-size:12px;max-width:220px}
.ftbl td.note{color:var(--muted);font-size:12.5px;max-width:340px}
.kind{font-size:11.5px;font-weight:500;padding:1px 8px;border-radius:999px;background:var(--err-soft);color:var(--err);white-space:nowrap;display:inline-block;margin-bottom:3px}
.kind.k-low{background:var(--warn-soft);color:var(--warn)}
.kind.k-dv{background:var(--skip-soft);color:var(--fg)}
.fwrap{overflow:auto;max-height:640px;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
.empty{padding:36px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(29,29,31,.88);backdrop-filter:blur(20px);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;z-index:20;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.15)}
.note{font-size:12.5px;color:var(--muted)}
@media (max-width:700px){.wrap{padding-inline:16px;padding-block:28px 56px;gap:28px}.hdr-in{padding-inline:16px}.hdr-note{display:none}.intro h1{font-size:30px}.toolbar{padding:12px}.seg,.cats{flex-wrap:wrap}}
@media (prefers-reduced-motion:no-preference){.btn,.cat,.seg button,.drop,.tabs button{transition:background .15s,border-color .15s,color .15s}}
</style>

</head>
<body>
<header class="hdr"><div class="hdr-in">
  <div class="brand"><span class="mark"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><b>Сверка НВОС</b><span class="sub">ДПиООС</span></div>
  <div class="hdr-note"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Файлы обрабатываются в браузере и никуда не отправляются</div>
</div></header>
<main class="wrap">
  <section class="intro">
    <div><div class="crumb" id="crumb"></div><h1 id="slots-title"></h1></div>
    <div class="actions">
      <button class="btn ghost small" data-act="demo" id="btn-demo">Загрузить пример</button>
      <button class="btn ghost small" data-act="clear" id="btn-clear">Очистить</button>
      <button class="btn primary" data-act="run" id="btn-run">Запустить проверку</button>
    </div>
  </section>
  <section class="toolbar" aria-label="Параметры сверки">
    <div class="seg" id="impacts" role="group" aria-label="Вид воздействия"></div>
    <div class="cats" id="cats" role="group" aria-label="Категория объекта"></div>
    <div class="params" id="params"></div>
  </section>
  <section>
    <div class="sec-h"><h2>Документы</h2><span>Перетащите выгрузки Excel в карточки — столбцы сопоставятся автоматически</span></div>
    <div id="slots" class="slots"></div>
  </section>
  <section id="report"></section>
</main>
<div class="toast" id="toast" hidden></div>

<script>
/* =====================================================================
   1. СПРАВОЧНИКИ
   ===================================================================== */
const IMPACTS = [
  { id: 'air',   label: 'Выбросы', gen: 'выброса', src: 'выброс' },
  { id: 'water', label: 'Сбросы',  gen: 'сброса',  src: 'сброс'  },
];

const CATEGORIES = [
  { id: 'I',   label: 'I категория',   docs: [], stub: true },
  { id: 'II',  label: 'II категория',  docs: ['DPNVOS', 'ONVOS', 'DVOS'], params: true },
  { id: 'III', label: 'III категория', docs: ['DPNVOS', 'ONVOS', 'PEK'] },
  { id: 'IV',  label: 'IV категория',  docs: ['DPNVOS', 'ONVOS'] },
];

/* Поля документов. aliases — фрагменты заголовка для автосопоставления (регистр, пробелы и знаки не важны).
   Поля перебираются по порядку, столбец занимается первым подходящим полем. */
const fld = (key, label, aliases, required = false) => ({ key, label, aliases, required });
const DOC_TYPES = {
  DPNVOS: { short: 'ДПНВОС', title: 'Декларация о плате за НВОС', fields: [
    fld('reportNo',  'Номер отчёта', ['номер отчета'], true),
    fld('year',      'Отчётный период', ['отчетный период', 'отчетный год'], true),
    fld('status',    'Статус отчёта', ['статус отчета']),
    fld('inn',       'ИНН', ['инн'], true),

   2. ПОМОЩНИКИ
   ===================================================================== */
function norm(v) { return v == null ? '' : String(v).replace(/\s+/g, ' ').trim().toUpperCase(); }
function num(v) {
  if (typeof v === 'number') return isFinite(v) ? v : null;
  if (v == null || v === '') return null;
  const n = parseFloat(String(v).replace(/\s/g, '').replace(',', '.'));
  return isNaN(n) ? null : n;
}
const normInn = v => String(v ?? '').replace(/\D/g, '');
const normZv = v => { const s = String(v ?? '').trim(); if (!s) return ''; return /^\d+$/.test(s) ? s.replace(/^0+(?=\d)/, '') : s.toUpperCase(); };
function catNorm(v) {
  const s = String(v ?? '').toUpperCase().replace(/[^IV0-9]/g, '');
  return ({ '1': 'I', '2': 'II', '3': 'III', '4': 'IV' })[s] || s;
}
function toDate(v) {
  if (v == null || v === '') return null;
  if (v instanceof Date) return isNaN(v) ? null : v;
  if (typeof v === 'number') {
    if (v > 20000 && v < 80000) { const u = new Date(Math.round((v - 25569) * 864e5)); return new Date(u.getUTCFullYear(), u.getUTCMonth(), u.getUTCDate()); }
    return null;
  }
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})/); if (m) return new Date(+m[3], +m[2] - 1, +m[1]);
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
  if (/^\d{5}(\.\d+)?$/.test(s)) return toDate(Number(s));
  return null;
}
const yearOf = v => { const d = v instanceof Date ? v.getFullYear() : parseInt(String(v ?? '').trim(), 10); return isNaN(d) ? null : d; };
const addYears = (d, n) => new Date(d.getFullYear() + n, d.getMonth(), d.getDate());
const fmtDate = d => d ? d.toLocaleDateString('ru-RU') : '';
function fmtNum(n) { return n == null ? '—' : Number(n).toLocaleString('ru-RU', { maximumFractionDigits: 7 }); }
function matchesImpact(v, impact) { const s = String(v ?? '').toLowerCase(); return impact === 'water' ? s.includes('сброс') : s.includes('выброс'); }

  { id: 'II-05', title: 'Масса ЗВ совпадает: ДПНВОС = ОНВОС = ДВОС (меньше реестра — предупреждение)', severity: 'error', categories: ['II'],

/* ---------- модель II категории: всё сводится по ключу «код объекта + ИНН» ---------- */
function f(o, extra) { return { objKey: o.key, objectCode: o.code, inn: o.inn, objectName: o.name, ...extra }; }
function presentDocs(o) {
  const P = [];
  if (o.dp) P.push(['DPNVOS', o.dp.rep.zv]);
  if (o.on && o.on.hasImpact) P.push(['ONVOS', o.on.zv]);
  if (o.dv) P.push(['DVOS', o.dv.rep.zv]);
  return P;
}
function unionZv(P) { const s = new Set(); for (const [, zv] of P) for (const k of zv.keys()) s.add(k); return [...s].sort(); }
function zvInfo(P, z) {
  const order = ['ONVOS', 'DVOS', 'DPNVOS'], sorted = [...P].sort((a, b) => order.indexOf(a[0]) - order.indexOf(b[0]));
  let code = null, name = '';
  for (const [, zv] of sorted) { const e = zv.get(z); if (e) { code ??= e.code; name ||= e.name; } }
  const dp = P.find(x => x[0] === 'DPNVOS')?.[1].get(z);
  if (dp && dp.dpCode && dp.dpCode !== code) code = `${code} (ДПНВОС: ${dp.dpCode})`;
  return { zvCode: code ?? z, zvName: name, zvKey: z };
}
function valsOf(o, P, z) {
  const v = {};
  for (const d of ['DPNVOS', 'ONVOS', 'DVOS']) {
    const p = P.find(x => x[0] === d);
    if (!p) { v[d] = { t: 'na' }; continue; }
    const e = p[1].get(z);
    v[d] = !e ? { t: 'miss' } : (e.massEmpty && !e.hasMass) ? { t: 'empty' } : { t: 'num', n: e.mass };
  }
  return v;
}

function modelII(ctx) {
  if (ctx._m) return ctx._m;
  const Y = ctx.settings.year, tol = ctx.settings.tol;
  const y0 = new Date(Y, 0, 1), y1 = new Date(Y, 11, 31, 23, 59, 59);
  const D = ctx.docs;
  const keyOf = r => norm(r.objectCode) + '|' + normInn(r.inn);
  const objs = new Map(), onByCode = new Map();
  const get = r => {
    const key = keyOf(r);
    let o = objs.get(key);
    if (!o) { o = { key, code: norm(r.objectCode), inn: normInn(r.inn), name: '', on: null, dp: null, dv: null, empty: {} }; objs.set(key, o); }
    if (!o.name && r.objectName) o.name = String(r.objectName).trim();
    return o;
  };
  const addZv = (map, r, o, doc) => {
    const z = normZv(r.zvCode), m = num(r.mass);
    if (!z) { if (m) (o.empty[doc] ||= []).push(r._row); return; }
    let e = map.get(z);
    if (!e) { e = { code: String(r.zvCode).trim(), name: r.zvName ? String(r.zvName).trim() : '', mass: 0, hasMass: false, massEmpty: false, over: 0, vrv: 0, total: 0, rows: [] }; map.set(z, e); }
    if (m == null) e.massEmpty = true; else { e.mass += m; e.hasMass = true; }
    if (!e.name && r.zvName) e.name = String(r.zvName).trim();
    e.over += num(r.massOver) || 0; e.vrv += num(r.massVrv) || 0; e.total += num(r.massTotal) || 0;
    e.rows.push(r._row);
  };

  if (D.ONVOS) {
    const typed = D.ONVOS.map.sourceType != null;
    for (const r of D.ONVOS.rows) {

/* =====================================================================
   4. ДВИЖОК
   ===================================================================== */
function runChecks(impact, catId) {

    const instances = rule.perDoc ? cat.docs.map(d => ({ docs: [d], docId: d })) : [{ docs: rule.needs || [] }];
    for (const inst of instances) {

      const res = { id, title: rule.title, draft: !!rule.draft, docs: inst.docs, status: 'ok', count: 0, errors: 0, note: '' };
      results.push(res);

      const need = rule.perDoc ? { [inst.docId]: rule.fields || [] } : (rule.fields || {});
      const missingF = [];
      for (const [d, fs] of Object.entries(need)) if (ctx.docs[d]) for (const k of fs) if (ctx.docs[d].map[k] == null) missingF.push(`${short(d)}: ${fieldLabel(d, k)}`);
      if (missingF.length) { res.status = 'skip'; res.note = 'Не сопоставлено: ' + missingF.join('; '); continue; }
      let out;

      catch (e) { console.error(e); res.status = 'skip'; res.note = 'Ошибка выполнения: ' + e.message; continue; }
      for (const x of out) { x.ruleId = id; x.ruleTitle = rule.title; x.severity = x.severity || rule.severity; findings.push(x); }
      res.count = out.length; res.errors = out.filter(x => x.severity === 'error').length;

  if (ctx._m) { report.objects = summarizeObjects(ctx._m, findings); report.lines = buildLines(ctx._m, findings); }

}

    [5044465, '18.08.2022', 2021, 'Принято', A[1], A[0], A[2], '2', '0002', 'Углерод (Сажа)', '0328', 0.000426],
    [3100001, '10.03.2017', 2016, 'Принято', B[1], B[0], B[2], '2', '0001', 'Азота диоксид', '0301', 1.2],
    [3100001, '10.03.2017', 2016, 'Принято', B[1], B[0], B[2], '2', '0001', 'Сера диоксид', '0330', 0.48],
    [6000001, '01.07.2019', 2018, 'Принято', D[1], D[0], D[2], '2', '0001', 'Азота диоксид', '0301', 0.8],
    [6000001, '01.07.2019', 2018, 'Принято', D[1], D[0], D[2], '2', '0001', 'Взвешенные вещества', '2902', ''],

  const pek = [['Код ОНВОС', 'ИНН', 'Код загрязняющего вещества', 'Загрязняющее вещество', `Масса ${g}ов тонн/год всего`],
    [A[0], A[1], '0301', 'Азота диоксид', 0.140382], [A[0], A[1], '0337', 'Углерод оксид', 0.55], [B[0], B[1], '0301', 'Азота диоксид', 1.35]];
  return { DPNVOS: dp, ONVOS: on, DVOS: dv, PEK: pek };
}
function loadDemo() {
  const data = demoData(state.impact);
  for (const d of curCat().docs) {
    const key = poolKey(d); if (state.pool[key]?.worker) state.pool[key].worker.terminate();
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(data[d]), 'Sheet1');
    const s = { fileName: `пример_${short(d)}.xlsx`, demo: true, kind: 'sheetjs', wb, sheets: wb.SheetNames, sheet: 0, ui: {} };
    sheetjsLoad(s); s.headerRow = detectHeaderRow(s.preview); s.headers = headersOf(s); s.map = automap(d, s.headers);
    const fields = Object.keys(s.map), recs = [];
    for (let i = s.headerRow + 1; i < s.aoa.length; i++) { const raw = s.aoa[i] || []; if (!raw.some(v => v !== '')) continue; const r = { _row: i + 1 }; for (const k of fields) r[k] = raw[s.map[k]]; recs.push(r); }
    s.records = recs; state.pool[key] = s; touchDoc(d);
  }
  const b = bucket(); b.settings.yearAuto = true; autoYear();
}

/* =====================================================================
   10. СОБЫТИЯ
   ===================================================================== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, d = el.dataset.doc, b = bucket();
  if (act === 'impact') { state.impact = el.dataset.id; saveNav(); autoYear(); renderAll(); }
  else if (act === 'cat') { state.cat = el.dataset.id; saveNav(); autoYear(); renderAll(); }
  else if (act === 'remove') { const s = slotOf(d); if (s?.worker) s.worker.terminate(); delete state.pool[poolKey(d)]; touchDoc(d); renderParams(); renderSlots(); renderReport(); renderRunState(); }
  else if (act === 'demo') { loadDemo(); renderParams(); renderSlots(); renderReport(); toast('Загружены примеры — замените их своими файлами'); }
  else if (act === 'clear') { for (const dd of curCat().docs) { const s = slotOf(dd); if (s?.worker) s.worker.terminate(); delete state.pool[poolKey(dd)]; touchDoc(dd); } b.report = null; b.stale = false; renderParams(); renderSlots(); renderReport(); renderRunState(); }
  else if (act === 'view') { state.view = el.dataset.id; renderReport(); }
  else if (act === 'run') {
    if (!curCat().docs.some(dd => slotOf(dd)?.records)) { toast('Сначала загрузите хотя бы один документ'); return; }
    const btn = $('#btn-run'); btn.disabled = true; btn.textContent = 'Проверяю…';
    setTimeout(() => {
      try { b.report = runChecks(state.impact, state.cat); b.stale = false; state.filter = { sev: 'all', rule: 'all', q: '', onlyBad: true, line: 'ok' }; }
      catch (err) { console.error(err); toast('Проверка прервалась: ' + err.message); }
      renderRunState(); renderReport();
      $('#report').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
    }, 30);
  }
  else if (act === 'export') exportReport();
});

document.addEventListener('change', async e => {
  const el = e.target, act = el.dataset?.act, d = el.dataset?.doc;
  if (el.id === 'flt-sev') { state.filter.sev = el.value; renderTable(); return; }
  if (el.id === 'flt-rule') { state.filter.rule = el.value; renderTable(); return; }
  if (el.id === 'flt-bad') { state.filter.onlyBad = el.checked; renderTable(); return; }
  if (el.id === 'flt-line') { state.filter.line = el.value; renderTable(); return; }
  if (el.id === 'p-year') { const b = bucket(); b.settings.year = +el.value; b.settings.yearAuto = false; if (b.report) b.stale = true; renderParams(); renderReport(); return; }
  if (el.id === 'p-tol') { const v = num(el.value); const b = bucket(); if (v == null || v < 0) { toast('Допуск — неотрицательное число, например 0,000001'); el.value = b.settings.tol; return; } b.settings.tol = v; if (b.report) b.stale = true; renderReport(); return; }
  if (!act) return;
  if (act === 'file' && el.files?.[0]) { openFile(d, el.files[0]); return; }
  const s = slotOf(d); if (!s || s.loading) return;
  try {
    if (act === 'sheet') { s.sheet = +el.value; await reHead(d, s); }
    else if (act === 'hdr') { s.headerRow = Math.min(29, Math.max(0, (parseInt(el.value, 10) || 1) - 1)); s.headers = headersOf(s); s.map = automap(d, s.headers); }
    else if (act === 'map') { if (el.value === '') delete s.map[el.dataset.field]; else s.map[el.dataset.field] = Number(el.value); s.ui.map = true; }
    if (s.demo) { s.kind = 'sheetjs'; }
    await loadRows(d, s);
  } catch (err) { s.loading = null; s.error = 'Ошибка чтения: ' + err.message; renderSlots(); renderRunState(); }
});

document.addEventListener('input', e => { if (e.target.id === 'flt-q') { state.filter.q = e.target.value; renderTable(); } });
document.addEventListener('toggle', e => {
  const det = e.target; if (!det.dataset?.ui) return;
  const d = det.closest('.slot')?.dataset.doc, s = d && slotOf(d);
  if (s) s.ui[det.dataset.ui] = det.open;
}, true);

const slotsEl = $('#slots');
slotsEl.addEventListener('dragover', e => { const s = e.target.closest('.slot'); if (!s) return; e.preventDefault(); s.classList.add('drag'); });
slotsEl.addEventListener('dragleave', e => { const s = e.target.closest('.slot'); if (s && !s.contains(e.relatedTarget)) s.classList.remove('drag'); });
slotsEl.addEventListener('drop', e => {
  const s = e.target.closest('.slot'); if (!s) return; e.preventDefault(); s.classList.remove('drag');
  const fl = e.dataTransfer?.files?.[0]; if (fl) openFile(s.dataset.doc, fl);
});

/* ---------- старт: открываемся с примером II категории ---------- */
function boot() {
  if (typeof XLSX === 'undefined') { $('#slots').innerHTML = '<div class="stub" style="grid-column:1/-1"><b>Не загрузилась библиотека чтения Excel</b>Обновите страницу.</div>'; return; }
  if (!curCat().stub) { loadDemo(); bucket().report = runChecks(state.impact, state.cat); bucket().stale = false; }
  renderAll();
}
boot();
</script>
