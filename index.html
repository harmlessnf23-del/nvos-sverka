<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Сверка НВОС: ДПНВОС, реестр ОНВОС, ДВОС, ПЭК"><link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2048%2048%22%3E%3Crect%20width%3D%2248%22%20height%3D%2248%22%20rx%3D%2211%22%20fill%3D%22%23fff%22/%3E%3Ccircle%20class%3D%22l-in%22%20cx%3D%2220%22%20cy%3D%2220%22%20r%3D%2212.5%22%20fill%3D%22%23E3F3EF%22/%3E%3Cg%20class%3D%22l-b%22%20fill%3D%22%230B1F33%22%3E%3Crect%20x%3D%2211.5%22%20y%3D%2221.5%22%20width%3D%223.2%22%20height%3D%226%22/%3E%3Crect%20x%3D%2215.5%22%20y%3D%2218.5%22%20width%3D%223.2%22%20height%3D%229%22/%3E%3Crect%20x%3D%2219.5%22%20y%3D%2214.5%22%20width%3D%223.2%22%20height%3D%2213%22/%3E%3Crect%20x%3D%2223.5%22%20y%3D%2220%22%20width%3D%223.2%22%20height%3D%227.5%22/%3E%3Crect%20x%3D%2210%22%20y%3D%2227.5%22%20width%3D%2220%22%20height%3D%221.6%22/%3E%3C/g%3E%3Cg%20class%3D%22l-s%22%20fill%3D%22%23A0AEC0%22%3E%3Ccircle%20cx%3D%2222.6%22%20cy%3D%2212%22%20r%3D%221.8%22/%3E%3Ccircle%20cx%3D%2225.2%22%20cy%3D%229.4%22%20r%3D%221.3%22/%3E%3C/g%3E%3Cline%20class%3D%22l-h%22%20x1%3D%2230%22%20y1%3D%2230%22%20x2%3D%2241%22%20y2%3D%2241%22%20stroke%3D%22%23346E58%22%20stroke-width%3D%225.5%22%20stroke-linecap%3D%22round%22/%3E%3Ccircle%20class%3D%22l-r%22%20cx%3D%2220%22%20cy%3D%2220%22%20r%3D%2213.5%22%20fill%3D%22none%22%20stroke%3D%22%23479C80%22%20stroke-width%3D%224%22/%3E%3C/svg%3E"><style>html,body{margin:0;padding:0}</style><title>Сверка НВОС</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: в духе системных интерфейсов macOS/iOS — матовая шапка, крупный заголовок, сегментированные переключатели, белые карточки на сером фоне, синий акцент */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --surface-2:#EEF1F5; --fg:#0F1726; --muted:#566178; --faint:#667085; --line:#E6EAF0; --line-2:#DCE1E9;
  --accent:#1F5EDB; --accent-fg:#FFFFFF; --accent-soft:#EAF1FF; --accent-hover:#1747A6;
  --err:#C2183A; --err-soft:#FCE8EC; --warn:#9A4B00; --warn-soft:#FEF1DE; --ok:#13804F; --ok-soft:#E3F6EC; --skip:#3D475B; --skip-soft:#EEF1F5;
  --rail:#0E1726; --rail-2:#162037; --rail-3:#1C2840; --rail-fg:#C7CFDC; --rail-dim:#9AA6BA; --mint:#2FBF83;
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Helvetica Neue",Arial,sans-serif;
  --f-mono:"SF Mono",ui-monospace,Menlo,"JetBrains Mono",Consolas,monospace;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06);
  --r:18px; --r-s:12px;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.5;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;margin:0}
h1,h2,h3{margin:0;text-wrap:balance}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
svg{flex:none}

/* ---------- шапка ---------- */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:rgba(251,251,253,.8);backdrop-filter:saturate(1.8) blur(20px);-webkit-backdrop-filter:saturate(1.8) blur(20px);border-bottom:1px solid rgba(0,0,0,.08)}
.hdr-in{max-width:1180px;margin:0 auto;padding:10px 32px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(180deg,#34C759,#1E9E45);color:#fff;display:grid;place-items:center}
.brand b{font-size:15px;font-weight:600;letter-spacing:-.01em}
.brand .sub{color:var(--faint);font-size:13px;padding-left:10px;border-left:1px solid var(--line-2)}
.hdr-note{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.hdr-note svg{color:var(--accent)}

.wrap{max-width:1180px;margin:0 auto;padding-inline:32px;padding-block:48px 88px;display:flex;flex-direction:column;gap:40px}
.intro{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.crumb{font-size:15px;color:var(--faint);font-weight:500;display:flex;gap:6px;align-items:center;margin-bottom:6px}
.crumb i{font-style:normal;color:var(--faint)}
.intro h1{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* ---------- строка управления ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;background:var(--surface);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.tgroup{display:flex;align-items:center;gap:10px}
.tlabel{font-size:12.5px;color:var(--muted)}
.seg,.cats{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 14px;border-radius:7px;cursor:pointer;font-weight:500;color:var(--muted);display:inline-flex;align-items:center;gap:7px;font-size:13.5px}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
.seg button[aria-pressed="true"] svg{color:var(--accent)}
.cat{border:0;background:transparent;border-radius:7px;padding:5px 14px;cursor:pointer;display:inline-flex;align-items:baseline;gap:5px;font-size:13.5px;color:var(--muted);font-weight:500}
.cat b{font-weight:600}
.cat small{font-size:12.5px}
.cat:hover{color:var(--fg)}
.cat[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
.cat .stubdot{font-size:11px;color:var(--faint)}
.params{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;margin-left:auto}
.pf{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.pf select,.pf input{border:0;background:var(--surface-2);border-radius:8px;padding:6px 10px;font-size:13.5px;color:var(--fg)}
.pf select#p-year{font-weight:600}
.pf input{width:110px;font-variant-numeric:tabular-nums}
.pwarn{font-size:12px;color:var(--warn);background:var(--warn-soft);padding:3px 9px;border-radius:999px}
.toolbar-note{flex-basis:100%;font-size:12.5px;color:var(--faint);margin-top:-2px}
@media (max-width:900px){.params{margin-left:0}}

.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.sec-h h2{font-size:24px;font-weight:700;letter-spacing:-.02em}
.sec-h span{font-size:13px;color:var(--muted)}

/* ---------- кнопки ---------- */
.btn{border:0;background:var(--surface);padding:8px 16px;border-radius:999px;box-shadow:0 0 0 1px var(--line-2) inset;color:var(--accent);cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:7px;font-size:13.5px}
.btn:hover{background:var(--accent-soft)}
.btn.primary{background:var(--accent);color:#fff;box-shadow:none;padding:9px 20px;font-weight:500}
.btn.primary:hover{background:var(--accent-hover)}
.btn.small{padding:5px 11px;font-size:13px}
.btn.ghost{box-shadow:none;background:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- документы ---------- */
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.slot{background:var(--surface);border:0;border-radius:var(--r);padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;min-width:0}
.slot.drag{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.slot-h{display:flex;align-items:flex-start;gap:12px}
.step{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;background:var(--surface-2);color:var(--muted);flex:none;margin-top:1px}
.step.ok{background:#34C759;color:#fff}
.step.bad{background:var(--err-soft);color:var(--err)}
.step.load{background:var(--accent-soft);color:var(--accent)}
.slot-t{min-width:0;flex:1;display:flex;flex-direction:column}
.slot-t b{font-size:19px;font-weight:600;letter-spacing:-.02em}
.slot-t small{color:var(--muted);font-size:12.5px;line-height:1.35}
.chip{font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;white-space:nowrap;color:var(--muted);background:var(--surface-2)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--err-soft);color:var(--err)}
.chip.load{background:var(--accent-soft);color:var(--accent)}
.shared{font-size:12px;color:var(--faint)}
.drop{border:1.5px dashed var(--line-2);border-radius:14px;background:#FAFAFC;padding:28px 12px;text-align:center;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.drop:hover{border-color:var(--accent);color:var(--fg);background:var(--accent-soft)}
.drop svg{color:var(--accent)}
.drop:hover svg{color:var(--accent)}
.drop u{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:3px}
.drop small{display:block;font-size:12px;color:var(--faint)}
.file{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.file .name{font-weight:500;word-break:break-all;min-width:0;display:flex;gap:8px;align-items:center;font-size:13.5px}
.file .name svg{color:var(--muted)}
.badge{font-size:11px;font-weight:500;padding:1px 8px;border-radius:999px;background:var(--warn-soft);color:var(--warn);white-space:nowrap}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);align-items:center}
.meta label{display:inline-flex;gap:6px;align-items:center}
.meta select,.meta input{border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:3px 6px;font-size:12.5px;max-width:160px}
.meta input{width:56px}
.mapstate{font-size:12.5px;display:flex;gap:7px;align-items:center;color:var(--muted)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:none}
.dot.bad{background:var(--err)}
.prog{display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--muted)}
.prog .track{height:5px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.prog .fill{height:100%;background:var(--accent);width:0;border-radius:999px;transition:width .25s}
.errbox{background:var(--err-soft);color:var(--err);border-radius:var(--r-s);padding:9px 11px;font-size:13px}
details{border-top:1px solid var(--line);padding-top:12px}
summary{cursor:pointer;font-size:13px;color:var(--muted);font-weight:500;list-style:none;display:flex;align-items:center;gap:6px}
summary::-webkit-details-marker{display:none}
summary::before{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .15s;margin-right:2px}
details[open]>summary::before{transform:rotate(45deg)}
summary:hover{color:var(--fg)}
.maptbl{width:100%;border-collapse:collapse;margin-top:8px;font-size:12.5px}
.maptbl td{padding:3px 0;vertical-align:middle}
.maptbl td:first-child{padding-right:8px;color:var(--muted)}
.maptbl select{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:4px 6px;font-size:12.5px}
.maptbl select.unset{border-color:var(--err)}
.req{color:var(--err)}
.scroll{overflow-x:auto;margin-top:8px;border:1px solid var(--line);border-radius:var(--r-s)}
.prev{border-collapse:collapse;font-size:11.5px;font-family:var(--f-mono);white-space:nowrap}
.prev th,.prev td{padding:4px 8px;border-bottom:1px solid var(--line);text-align:left;max-width:240px;overflow:hidden;text-overflow:ellipsis}
.prev th{background:var(--surface-2);font-weight:500}
.stub{background:var(--surface);border:1.5px dashed var(--line-2);border-radius:var(--r);padding:44px;text-align:center;color:var(--muted)}
.stub b{color:var(--fg);display:block;font-size:16px;margin-bottom:4px;font-weight:600}

/* ---------- отчёт ---------- */
.report{display:flex;flex-direction:column;gap:20px;min-width:0}
.rep-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-end}
.rep-h h2{font-size:28px;font-weight:700;letter-spacing:-.025em}
.stale{background:var(--warn-soft);color:var(--warn);padding:10px 14px;border-radius:var(--r-s);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{display:flex;flex-direction:column;gap:4px;padding:18px 20px;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);min-width:0}
.stat span{font-size:12.5px;color:var(--muted);order:-1}
.stat b{font-size:30px;font-weight:600;line-height:1.15;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat.err b{color:var(--err)}
.stat.warn b{color:var(--warn)}
.stat.ok b{color:var(--ok)}
.panel{background:var(--surface);box-shadow:var(--shadow);border-radius:var(--r);overflow:hidden;min-width:0}
.rules{display:flex;flex-direction:column;background:var(--surface);box-shadow:var(--shadow);border-radius:var(--r);overflow:hidden}
.rule{display:grid;grid-template-columns:96px 1fr auto;gap:14px;padding:12px 20px;align-items:center;border-top:1px solid var(--line);font-size:13.5px}
.rule:first-child{border-top:0}
.rule .rid{font-size:12.5px;color:var(--faint);font-weight:500;font-variant-numeric:tabular-nums}
.rule .rt{min-width:0}
.rule .rt small{display:block;color:var(--muted);font-size:12px}
.tech{border-top:1px solid var(--line);padding:0}
.tech>summary{padding:12px 20px}
.tech[open]>summary{border-bottom:1px solid var(--line)}
.tech .rule{background:var(--bg)}
.draft{font-size:10.5px;font-weight:500;color:var(--muted);border:1px solid var(--line-2);border-radius:4px;padding:0 5px;margin-left:6px;white-space:nowrap}
.pill{font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;white-space:nowrap;display:inline-block}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.fail{background:var(--err-soft);color:var(--err)}
.pill.warnp{background:var(--warn-soft);color:var(--warn)}
.pill.skip{background:var(--skip-soft);color:var(--skip)}
@media (max-width:600px){.rule{grid-template-columns:1fr auto}.rule .rid{grid-column:1/-1}}
.tabs{display:inline-flex;align-self:flex-start;background:var(--surface-2);border-radius:9px;padding:2px;gap:2px}
.tabs button{border:0;background:transparent;padding:6px 16px;cursor:pointer;font-weight:500;color:var(--muted);border-radius:7px;font-size:13.5px}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected="true"]{color:var(--fg);background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters select,.filters input[type=search]{border:0;background:var(--surface);box-shadow:0 0 0 1px var(--line) inset;border-radius:10px;padding:8px 11px;font-size:13px;min-width:0}
.filters input[type=search]{flex:1;min-width:180px}
.filters label{font-size:13px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.ftbl{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
.ftbl th,.ftbl td{padding:11px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.ftbl tbody tr:last-child td{border-bottom:0}
.ftbl th{font-size:12px;color:var(--faint);font-weight:600;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);position:sticky;top:0;z-index:1;white-space:nowrap;box-shadow:inset 0 -1px 0 var(--line)}
.ftbl tbody tr:hover td{background:#FAFAFC}
.ftbl td.sev{white-space:nowrap;font-weight:500;font-size:12.5px}
.ftbl td.sev::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:7px;vertical-align:2px}
.ftbl tr.error td.sev{color:var(--err)} .ftbl tr.error td.sev::before{background:var(--err)}
.ftbl tr.warning td.sev{color:var(--warn)} .ftbl tr.warning td.sev::before{background:var(--warn)}
.ftbl .num{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:12.5px}
.ftbl td.v{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right;font-size:12.5px}
.ftbl td.v.miss{color:var(--err);font-family:var(--f-ui);text-align:center;font-weight:500}
.ftbl td.v.miss span{background:var(--err-soft);padding:1px 8px;border-radius:999px;font-size:12px}
.ftbl td.v.na{color:var(--faint);text-align:center}
.ftbl .obj{font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:500;white-space:nowrap}
.ftbl .obj small{display:block;color:var(--muted)}
.ftbl .zv small{display:block;color:var(--muted);font-size:12px;max-width:220px}
.ftbl td.note{color:var(--muted);font-size:12.5px;max-width:340px}
.kind{font-size:11.5px;font-weight:500;padding:1px 8px;border-radius:999px;background:var(--err-soft);color:var(--err);white-space:nowrap;display:inline-block;margin-bottom:3px}
.kind.k-low{background:var(--warn-soft);color:var(--warn)}
.kind.k-dv{background:var(--skip-soft);color:var(--fg)}
.fwrap{overflow:auto;max-height:640px;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
.empty{padding:36px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(29,29,31,.88);backdrop-filter:blur(20px);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;z-index:20;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.15)}
.note{font-size:12.5px;color:var(--muted)}
@media (max-width:700px){.wrap{padding-inline:16px;padding-block:28px 56px;gap:28px}.hdr-in{padding-inline:16px}.hdr-note{display:none}.intro h1{font-size:30px}.toolbar{padding:12px}.seg,.cats{flex-wrap:wrap}}
@media (prefers-reduced-motion:no-preference){.btn,.cat,.seg button,.drop,.tabs button{transition:background .15s,border-color .15s,color .15s}}
.drop{flex:1;justify-content:center}
/* компактные карточки загрузки: все четыре в один ряд */
.slots{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.slot{padding:16px;gap:10px;border-radius:16px}
.slot-h{gap:9px}
.slot-h .step{width:22px;height:22px;font-size:12px}
.slot-t b{font-size:16px}
.slot-t small{font-size:12px}
.slot .chip{font-size:11.5px;padding:1px 8px}
.slot .drop{padding:16px 8px;gap:4px;font-size:13px}
.slot .drop svg{width:20px;height:20px}
.slot .file .name{font-size:12.5px}
.slot .meta{gap:4px 10px;font-size:12px}
.slot details{padding-top:8px}
.slot .btn.small{padding:4px 10px;font-size:12.5px}
.slot .shared{font-size:11.5px;line-height:1.35}
@media (max-width:1000px){.slots{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.slots{grid-template-columns:1fr}}
.declbar{flex-basis:100%;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding-top:12px;border-top:1px solid var(--line)}
.declbar input{width:200px}
.decl-card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.decl-card.bad{color:var(--err);background:var(--err-soft);box-shadow:none}
.decl-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-start}
.decl-h h2{font-size:24px;font-weight:700;letter-spacing:-.02em}
.decl-cats{display:inline-flex;flex-wrap:wrap;background:var(--surface-2);border-radius:9px;padding:2px;gap:2px}
.decl-objs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px;max-height:260px;overflow:auto}
.decl-obj{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;padding:7px 10px;border-radius:10px;background:var(--bg);font-size:13px;opacity:.6}
.decl-obj.on{opacity:1;background:var(--accent-soft)}
.decl-obj small{flex-basis:100%;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0 4px}
.catbox{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:3px;padding:12px 14px;border-radius:14px;background:var(--surface,#fff);border:1px solid var(--line,#E5E5EA);transition:border-color .15s,box-shadow .15s}
.catbox:hover{border-color:var(--accent)}
.catbox.on{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,113,227,.14)}
.catbox b{font-size:15px;font-weight:600}
.catbox span{font-size:12.5px;color:var(--muted,#6E6E73)}
.catbox em{font-style:normal;font-size:12.5px;display:flex;gap:10px}
.catbox i{font-style:normal;font-weight:600}
.catbox i.e{color:var(--err,#D70015)} .catbox i.w{color:var(--warn,#B25000)}
/* кнопка в строке таблицы: маленькая, залитая синим, в одну строку */
.cpy{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;gap:5px;cursor:pointer;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;padding:1px 7px;margin-left:-7px;border-radius:6px;user-select:text}
.cpy svg{color:var(--faint)}
.cpy:hover{background:var(--accent-soft);color:var(--accent)} .cpy:hover svg{color:var(--accent)}
.cpy:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.cpy.done,.cpy.done svg{color:var(--ok)}
.decl-h .cpy{margin-left:0}
.yn{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font-size:14px;font-weight:800;line-height:1}
.yn.y{background:var(--ok-soft);color:var(--ok)} .yn.n{background:var(--err-soft);color:var(--err)}
.ftbl td.act{width:1%;white-space:nowrap;text-align:right;padding-left:8px}
.rowbtn{display:inline-block;background:var(--accent);color:#fff;font-size:12px;font-weight:500;line-height:1.3;padding:4px 10px;border-radius:999px;white-space:nowrap}
tr.rowlink:hover .rowbtn{background:var(--accent-hover)}
tr.rowlink{cursor:pointer} tr.rowlink:hover td{background:rgba(0,113,227,.05)}
.pill.upd{background:var(--accent-soft);color:var(--accent)}
.hz{display:inline-block;font-family:var(--f-ui);font-size:11px;font-weight:600;padding:0 6px;border-radius:999px;background:var(--skip-soft);color:var(--muted);vertical-align:1px;white-space:nowrap}
.ftbl td.zv{min-width:96px}
.hz.hz1{background:var(--err-soft);color:var(--err)} .hz.hz2{background:var(--warn-soft);color:var(--warn)}
.ftbl tr.sub td{background:#FAFAFC;padding-top:7px;padding-bottom:7px;font-size:12.5px}
.ftbl tr.sub td.obj{font-weight:400;padding-left:28px}
.ftbl tr.grp td{background:var(--surface-2);font-weight:600;font-size:12.5px;padding-top:8px;padding-bottom:8px}
.ftbl tr.grp td small{font-weight:400;color:var(--muted);margin-left:8px}
.srcn{display:inline-block;margin-top:3px;font-size:11.5px;color:var(--accent);font-weight:500}
.srcn::before{content:"▸ ";}
tr.open .srcn::before{content:"▾ ";}

/* =========================================================
   Каркас «D · Современный»: тёмная боковая панель + рабочая область
   ========================================================= */
.btn{border-radius:12px}
.catbox:focus-visible,.prob:focus-visible,.ws-item:focus-visible,.segm button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:flex;min-height:100vh;align-items:stretch}
.rail{flex:0 0 240px;background:var(--rail);color:var(--rail-fg);padding:20px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;overflow:auto}
.rail .brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.rail .brand .mark{width:34px;height:34px;border-radius:10px;background:var(--mint);color:var(--rail);display:grid;place-items:center}
.rail .brand b{display:block;font-weight:600;font-size:15px;color:#fff}
.rail .brand small{color:var(--rail-dim);font-size:12.5px}
.nav{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--rail-fg);cursor:pointer}
.nav button:hover{background:var(--rail-2);color:#fff}
.nav button[aria-current="page"]{background:var(--rail-3);color:#fff;font-weight:500}
.nav button:focus-visible{outline:2px solid #6EA0FF;outline-offset:1px}
.nav button:disabled{opacity:.45;cursor:not-allowed}
.nav .cnt{margin-left:auto;font-size:12.5px;color:var(--rail-dim);font-variant-numeric:tabular-nums}
.nav .dots{margin-left:auto;display:inline-flex;gap:3px}
.nav .dots i{width:6px;height:6px;border-radius:50%;background:#3A4560}
.nav .dots i.ok{background:var(--mint)} .nav .dots i.load{background:#6EA0FF} .nav .dots i.bad{background:#F05A6E}
.rail-card{margin-top:auto;background:var(--rail-2);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.rail .params{margin:0;display:flex;flex-direction:column;align-items:stretch;gap:10px}
.rail .pf{display:flex;flex-direction:column;align-items:stretch;gap:4px;color:var(--rail-dim);font-size:12.5px}
.rail .pf select,.rail .pf input{background:var(--rail);border:1px solid #2A3753;color:#fff;width:100%;border-radius:10px;padding:8px 10px;font-size:13.5px}
.rail .pf select#p-year{font-weight:600}
.rail .pwarn{background:#3A2A12;color:#FFC97A;border-radius:8px}
.rail #btn-run{width:100%;justify-content:center;background:var(--mint);color:#0B1A12;font-weight:600;border-radius:10px;padding:10px 12px}
.rail #btn-run:hover{background:#45D196}
.rail-note{font-size:12px;color:var(--rail-dim)}
.rail-priv{display:flex;gap:6px;font-size:11.5px;color:var(--rail-dim);line-height:1.35;padding:0 6px}
.rail-priv svg{flex:none;margin-top:1px}
.main{flex:1;min-width:0;padding:24px 32px 64px;display:flex;flex-direction:column;gap:20px}
.main>*{max-width:1320px;width:100%}
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px}
.topbar .tt{flex:1 1 260px;min-width:0}
.topbar h1{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue","Segoe UI",sans-serif;font-size:28px;line-height:1.2;font-weight:700;letter-spacing:-.02em}
.topbar p{margin:2px 0 0;color:var(--muted)}
.gsearch{flex:0 1 360px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;padding:0 12px}
.gsearch:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.gsearch input{flex:1;min-width:0;border:0;background:transparent;padding:10px 0;font:inherit;color:var(--fg)}
.gsearch input:focus{outline:none}
.gsearch{position:relative;padding-right:4px}
.gs-btn{border:0;background:var(--accent);color:#fff;border-radius:9px;padding:6px 12px;font-weight:600;cursor:pointer;flex:none}
.gs-btn:hover{background:var(--accent-hover)}
.g-res{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:30;background:var(--surface);border-radius:14px;box-shadow:0 12px 40px rgba(16,24,40,.18),0 0 0 1px var(--line);padding:6px;max-height:420px;overflow:auto}
.g-res .gr{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:10px}
.g-res .gr:hover,.g-res .gr:focus-visible{background:var(--accent-soft);outline:none}
.g-res .gr .wi{flex:1;min-width:0}
.g-res .gr .no{display:block;font-family:var(--f-mono);font-size:13px;font-weight:500}
.g-res .gr .org{display:block;color:var(--skip);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-res .gr mark{background:#FFE89A;color:inherit;border-radius:3px}
.g-res .gh{padding:6px 10px 4px;font-size:12px;color:var(--muted)}
.g-res .gnone{padding:12px 10px;color:var(--muted)}
.g-res .gall{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:block;padding:9px 10px;border-radius:10px;color:var(--accent);font-weight:500;border-top:1px solid var(--line);margin-top:4px}
.g-res .gall:hover,.g-res .gall:focus-visible{background:var(--accent-soft)}
.ws-hit{animation:wsHit 1.2s ease-out}
@keyframes wsHit{from{box-shadow:0 0 0 4px var(--accent)}to{box-shadow:var(--shadow)}}
@media (prefers-reduced-motion:reduce){.ws-hit{animation:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{background:var(--surface);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.kpi .lbl{color:var(--muted);display:flex;gap:8px;align-items:center}
.kpi .lbl i{width:8px;height:8px;border-radius:50%;flex:none}
.kpi .big{font-size:30px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .sub{color:var(--muted);font-size:12.5px}
.kpi.ringk{display:flex;gap:14px;align-items:center}
.ring{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;flex:none}
.ring b{width:48px;height:48px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:13px;font-weight:700}
.kdocs{list-style:none;margin:6px 0 0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 10px;font-size:13px}
.kdocs li{display:flex;gap:6px;align-items:center}
.kdocs .y{color:var(--ok);font-weight:700} .kdocs .n{color:var(--err);font-weight:700}
.probs-card{padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.probs-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:baseline}
.probs-h h2{font-size:17px;font-weight:600}
.probs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 28px}
.prob{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:64px minmax(0,1fr) 76px;gap:12px;align-items:center;padding:8px 10px;border-radius:12px;background:#F6F8FB}
.prob:hover{background:#EDF2FA}
.prob.on{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.prob .rid{font-family:var(--f-mono);font-size:12.5px;font-weight:500}
.prob .pt{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prob .bar{display:block;height:6px;margin-top:4px;border-radius:999px;background:#E4E8EF;overflow:hidden}
.prob .bar i{display:block;height:100%;border-radius:999px;background:var(--err)}
.prob .bar i.w{background:var(--warn-fill)}
.prob .pn{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.prob .pn small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.ws{display:flex;flex-wrap:wrap;overflow:hidden;align-items:stretch}
.ws-list{flex:1 1 300px;max-width:360px;border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.ws-head{padding:16px 16px 10px;display:flex;flex-direction:column;gap:10px}
.ws-head h2{font-size:17px;font-weight:600}
.segm{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;align-self:flex-start}
.segm button{border:0;background:transparent;color:var(--skip);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px}
.segm button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(16,24,40,.12)}
.rulechip{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:3px 4px 3px 10px;font-size:12.5px;font-weight:500}
.rulechip button{all:unset;cursor:pointer;width:20px;height:20px;border-radius:50%;display:grid;place-items:center}
.rulechip button:hover{background:#D6E4FF}
.ws-items{list-style:none;margin:0;padding:4px 8px 8px;overflow:auto;max-height:820px;display:flex;flex-direction:column;gap:2px}
.ws-item{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px}
.ws-item:hover{background:#F6F8FB}
.ws-item[aria-current="true"]{background:var(--accent-soft)}
.ws-item .wi{flex:1;min-width:0}
.ws-item .no{display:block;font-family:var(--f-mono);font-size:13px;font-weight:500}
.ws-item .org{display:block;color:var(--skip);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws-item .ct{display:inline-flex;gap:4px;flex:none}
.cnt-e,.cnt-w,.cnt-ok{padding:1px 8px;border-radius:999px;font-weight:600;font-size:12px;font-variant-numeric:tabular-nums}
.cnt-e{background:var(--err-soft);color:#A3122F} .cnt-w{background:var(--warn-soft);color:#8F4300} .cnt-ok{background:var(--ok-soft);color:var(--ok)}
.ws-more{margin:4px 16px 16px;font-size:13px}
.ws-detail{flex:999 1 460px;min-width:0;padding:18px 22px 22px}
.ws-detail .report{gap:14px}
.ws-detail .decl-card{box-shadow:none;padding:0;border-radius:0}
.ws-detail .fwrap{box-shadow:none;border:1px solid var(--line)}
.ws-detail .stat{box-shadow:none;border:1px solid var(--line);padding:12px 14px}
.ws-detail .stat b{font-size:22px}
.empty-card{padding:48px 24px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty-card b{color:var(--fg);font-size:17px}
.docs-intro{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.docs-intro p{margin:0;color:var(--muted)}
.docs-actions{display:flex;flex-wrap:wrap;gap:8px}
.stale{border-radius:12px}
/* свёрнутая панель */
.rail-top{display:flex;align-items:center;justify-content:space-between;gap:6px}
.rail-top .brand{padding:0 4px;min-width:0}
.brand-t{min-width:0}
.rail-toggle{all:unset;cursor:pointer;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--rail-dim);flex:none}
.rail-toggle:hover{background:var(--rail-2);color:#fff}
.rail-toggle:focus-visible{outline:2px solid #6EA0FF;outline-offset:1px}
.rail #btn-run{gap:8px}
.app.collapsed .rail{flex-basis:68px;width:68px;padding:16px 10px;gap:16px}
.app.collapsed .rail-top{flex-direction:column;gap:10px}
.app.collapsed .rail-top .brand{padding:0}
.app.collapsed .rail-toggle svg{transform:scaleX(-1)}
.app.collapsed .brand-t,.app.collapsed .nav .nl,.app.collapsed .nav .cnt,.app.collapsed .rail-priv,.app.collapsed .rail .params,.app.collapsed .rail-note,.app.collapsed #btn-run .lbl{display:none}
.app.collapsed .nav button{justify-content:center;padding:11px 0;position:relative}
.app.collapsed .nav .dots{position:absolute;left:50%;bottom:3px;transform:translateX(-50%);gap:2px;margin:0}
.app.collapsed .nav .dots i{width:4px;height:4px}
.app.collapsed .rail-card{padding:0;background:transparent}
.app.collapsed .rail #btn-run{padding:10px 0}
/* таблицы без горизонтальной прокрутки */
.main{padding:20px 24px 56px}
.ftbl th,.ftbl td{padding:9px 10px}
.ftbl th{white-space:normal;line-height:1.3}
.ftbl td{overflow-wrap:anywhere}
.ftbl td.v,.ftbl td.num,.ftbl .obj,.ftbl td.sev{overflow-wrap:normal}
.ftbl th.vh{text-align:right}
.ftbl td.note,.ftbl td.desc{max-width:none;min-width:140px}
.ftbl .zv small{max-width:none}
.ftbl small.blk,.note.blk{display:block;margin-top:2px}
.ftbl td.objc{min-width:150px}
.ftbl .obj-l{display:flex;gap:6px;align-items:center;white-space:nowrap}
.ftbl .obj-c{font-variant-numeric:tabular-nums;font-weight:500;font-size:12.5px}
.ftbl td.objc small{display:block;color:var(--muted);font-size:12px}
.ftbl td.objc small.mono{font-size:11.5px}
.ftbl td.sev small{font-weight:400}
.ws-list{max-width:330px}
/* рабочее место: когда места мало, список уходит наверх, карточка — на всю ширину */
.ws{container-type:inline-size}
.ws-detail{flex:999 1 720px}
@container (max-width:1060px){
  .ws-list{max-width:none;flex-basis:100%;border-right:0;border-bottom:1px solid var(--line)}
  .ws-head{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between}
  .ws-items{max-height:232px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:4px}
  .ws-more{align-self:flex-start}
}
.ws-detail{padding:16px 18px 18px}
.ws-detail .catgrid{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.ws-detail .stats{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.ws-detail .decl-h h2{font-size:22px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.probs{grid-template-columns:1fr}}
@media (max-width:900px){
  .app{flex-direction:column}
  .rail{position:static;height:auto;flex:none;padding:14px 16px;gap:12px}
  .app.collapsed .rail{flex-basis:auto;width:auto;padding:10px 16px}
  .app.collapsed .rail-top{flex-direction:row}
  .app.collapsed .brand-t{display:block}
  .app.collapsed .nav,.app.collapsed .rail-card{display:none}
  .nav{flex-direction:row;flex-wrap:wrap}
  .nav li{flex:1 1 auto}
  .rail-card{margin-top:0}
  .rail-priv{display:none}
  .main{padding:20px 16px 48px}
  .ws-list{max-width:none;border-right:0;border-bottom:1px solid var(--line)}
}
@media (max-width:560px){.kpis{grid-template-columns:1fr}}

/* =========================================================
   Дизайн-система «Контроль Москвы · Экология» (по макету Figma «НВОС»):
   Inter, текст #0B1F33, подписи #718096, основной зелёный #479C80,
   скругления 6px, теги 4px, табы с зелёным подчёркиванием, светлое меню
   ========================================================= */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#EDF2F7; --fg:#0B1F33; --muted:#718096; --faint:#718096;
  --line:rgba(11,31,51,.16); --line-2:#CBD5E0; --tabline:#D5DEF4;
  --accent:#479C80; --accent-hover:#3A7F65; --accent-soft:#E3F3EF; --accent-text:#3A7F65; --accent-100:#BBE1D6; --accent-800:#346E58;
  --err:#C53030; --err-soft:#FED7D7; --warn:#7A5600; --warn-soft:#FFF4CC; --warn-fill:#ECB000; --ok:#346E58; --ok-soft:#BBE1D6; --skip:#2D3748; --skip-soft:#E2E8F0;
  --rail:#FFFFFF; --rail-2:#EDF2F7; --rail-3:#E3F3EF; --rail-fg:#2D3748; --rail-dim:#718096; --mint:#479C80;
  --f-ui:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --f-mono:"Inter",-apple-system,"Segoe UI",sans-serif;
  --shadow:none; --r:8px; --r-s:6px;
}
body{letter-spacing:0;line-height:1.4;background:#fff}
.mono{font-variant-numeric:tabular-nums}
/* шапка */
.mh{position:sticky;top:0;z-index:20;height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:24px;padding:0 24px}
.ib{all:unset;box-sizing:border-box;width:40px;height:40px;border-radius:6px;display:grid;place-items:center;color:#718096;cursor:pointer;flex:none}
.ib:hover{background:#EDF2F7;color:var(--fg)}

.nav button[aria-current="page"] svg{color:var(--accent)}
.nav button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.nav .cnt{color:#718096;font-weight:500}
.nav .dots i{background:#CBD5E0} .nav .dots i.ok{background:var(--accent)} .nav .dots i.load{background:#0D4CD3} .nav .dots i.bad{background:#E53E3E}
.rail-card{background:#F7FAFC;border:1px solid var(--line);border-radius:8px;padding:12px}
.rail .pf{color:#718096;font-size:13px}
.rail .pf select,.rail .pf input{background:#EDF2F7;border:0;color:var(--fg);border-radius:6px;height:40px;padding:0 12px;font-size:14px}

.rail-note{color:#718096}
.app.collapsed .rail{flex-basis:64px;width:64px;padding:12px}
.app.collapsed .rail-card{background:transparent;border:0;padding:0}
.main{padding:20px 32px 56px;gap:20px}
/* заголовок страницы */
.topbar h1{font-family:var(--f-ui);font-size:20px;font-weight:600;letter-spacing:0;color:var(--fg)}
.topbar p{color:var(--muted)}
.gsearch{background:#EDF2F7;border:0;border-radius:6px;height:40px;padding:0 4px 0 12px}
.gsearch:focus-within{box-shadow:0 0 0 2px var(--accent);border-color:transparent}
.gsearch svg{color:#718096}
.gs-btn{background:var(--accent);border-radius:6px;height:32px;padding:0 12px}
.gs-btn:hover{background:var(--accent-hover)}
.g-res{border-radius:8px;box-shadow:0 8px 24px rgba(11,31,51,.14),0 0 0 1px var(--line)}
.g-res .gr:hover,.g-res .gr:focus-visible{background:var(--accent-soft)}
.g-res .gr mark{background:var(--accent-100)}
/* кнопки */
.btn{border-radius:6px;font-weight:600;font-size:14px;padding:10px 16px;color:var(--accent);box-shadow:none;background:transparent}
.btn:hover{background:var(--accent-soft)}
.btn.primary{background:var(--accent);color:#fff;padding:10px 16px}
.btn.primary:hover{background:var(--accent-hover)}
.btn.small{padding:6px 12px;font-size:14px}
.btn.ghost{color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rowbtn{background:var(--accent);border-radius:6px;font-weight:600;font-size:13px;padding:5px 12px}
tr.rowlink:hover .rowbtn{background:var(--accent-hover)}
/* карточки и итоги */
.kpi,.card,.stat,.slot,.panel,.decl-card,.fwrap,.toolbar{box-shadow:none!important;border:1px solid var(--line);border-radius:8px}
.kpi{padding:16px}
.kpi .big{font-size:24px;font-weight:600;letter-spacing:0}
.kpi .lbl,.kpi .sub,.stat span{color:#718096}
.stat{padding:14px 16px}
.stat b{font-size:24px;font-weight:600;letter-spacing:0}
.ring b{font-weight:600}
.kdocs .y{color:var(--accent)} .kdocs .n{color:#E53E3E}
.probs-h h2,.ws-head h2{font-size:16px;font-weight:600}
.prob{background:#F7FAFC;border-radius:6px}
.prob:hover{background:#EDF2F7}
.prob.on{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.prob .bar{background:#E2E8F0;height:4px}
.prob .bar i{background:#E53E3E} .prob .bar i.w{background:var(--warn-fill)}
.ws{border:1px solid var(--line);border-radius:8px}
.ws-item{border-radius:6px}
.ws-item:hover{background:#F7FAFC}
.ws-item[aria-current="true"]{background:var(--accent-soft)}

.ws-detail .decl-card{border:0}
.ws-detail .fwrap,.ws-detail .stat{border:1px solid var(--line)}
.decl-h h2{font-size:20px;font-weight:600;letter-spacing:0}
.crumb{color:#718096;font-size:14px;font-weight:400}

.pill,.chip,.kind,.badge{border-radius:4px;font-size:12px;font-weight:500;padding:3px 8px;line-height:1.4}
.pill.ok,.chip.ok{background:var(--accent-100);color:var(--accent-800)}
.pill.fail,.chip.bad,.kind{background:var(--err-soft);color:#9B2C2C}
.pill.warnp,.kind.k-low,.badge{background:var(--warn-soft);color:var(--warn)}
.pill.skip,.chip,.kind.k-dv{background:#E2E8F0;color:#1A202C}
.pill.upd{background:#EBF4FF;color:#0D4CD3}
.cnt-e,.cnt-w,.cnt-ok{border-radius:4px;font-weight:500}
.cnt-e{background:var(--err-soft);color:#9B2C2C} .cnt-w{background:var(--warn-soft);color:var(--warn)} .cnt-ok{background:var(--accent-100);color:var(--accent-800)}
.hz{border-radius:4px;background:#E2E8F0;color:#1A202C;font-weight:500}
.hz.hz1{background:var(--err-soft);color:#9B2C2C} .hz.hz2{background:var(--warn-soft);color:var(--warn)}
.yn.y{background:var(--accent-100);color:var(--accent-800)} .yn.n{background:var(--err-soft);color:#9B2C2C}
.cpy{color:#4A5568} .cpy:hover{background:var(--accent-soft);color:var(--accent-text)} .cpy.done,.cpy.done svg{color:var(--accent)}

.tabs{background:transparent;border-radius:0;padding:0;gap:24px;border-bottom:1px solid var(--tabline);align-self:stretch}
.tabs button{border-radius:0;padding:10px 4px 8px;color:#2D3748;font-weight:600;font-size:14px;background:transparent!important;box-shadow:none!important}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected="true"]{color:var(--fg);box-shadow:inset 0 -2px 0 var(--accent)!important}
.segm{background:transparent;padding:0;gap:8px}
.segm button{border-radius:6px;padding:6px 10px;color:var(--fg);font-weight:600;font-size:14px;white-space:nowrap}
.segm button:hover{background:#F7FAFC}
.segm button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-text);box-shadow:none}
.catbox{border:1px solid var(--line);border-radius:8px}
.catbox.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.catbox i.e{color:#C53030} .catbox i.w{color:var(--warn)}
.rulechip{background:var(--accent-soft);color:var(--accent-text);border-radius:4px}
/* таблицы */
.ftbl{font-size:14px}
.ftbl th{background:#fff;color:#718096;font-weight:400;font-size:14px;box-shadow:inset 0 -1px 0 var(--line);backdrop-filter:none}
.ftbl th,.ftbl td{padding:12px 8px;border-bottom:1px solid var(--line)}
.ftbl tbody tr:hover td{background:#F7FAFC}
.ftbl tr.grp td{background:#F7FAFC}
.ftbl td.sev{font-size:14px}
.ftbl .obj small,.ftbl .zv small,.ftbl td.objc small{color:#718096}
.fwrap{border:1px solid var(--line)}
/* поля */
.filters select,.filters input[type=search]{background:#EDF2F7;border:0;box-shadow:none;border-radius:6px;height:40px;padding:0 12px;font-size:14px;color:var(--fg)}
.filters input[type=search]:focus,.filters select:focus{outline:2px solid var(--accent);outline-offset:0}
.meta select,.meta input,.maptbl select{background:#EDF2F7;border:0;border-radius:6px}
/* загрузка */
.slot{padding:16px}
.step.ok{background:var(--accent)}
.drop{border:1.5px dashed #CBD5E0;border-radius:8px;background:#F7FAFC}
.drop:hover{border-color:var(--accent);background:var(--accent-soft)}
.drop svg,.drop u{color:var(--accent)}
.stale{background:var(--warn-soft);color:var(--warn);border-radius:6px}
.toast{border-radius:6px;background:#0B1F33}
.probs{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 20px}
.prob{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 12px;min-height:52px}
.psev{display:inline-block;width:8px;height:8px;border-radius:50%;background:#E53E3E;flex:none}
.psev.w{background:var(--warn-fill)} .psev.mix{background:linear-gradient(90deg,#E53E3E 50%,var(--warn-fill) 50%)}
.pmain{min-width:0;display:flex;flex-direction:column;gap:4px}
.prob .pt{font-size:14px;font-weight:500;color:var(--fg);white-space:normal;line-height:1.3;overflow:visible}
.pmeta{display:flex;align-items:center;gap:4px;min-width:0}
.pcat{display:inline-block;font-size:11px;font-weight:600;line-height:16px;padding:0 5px;border-radius:4px;background:#E2E8F0;color:#2D3748;flex:none}

.prob .pn{font-size:14px;line-height:1.2}

.plegend{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:12px;color:#718096}
.plegend span{display:inline-flex;align-items:center;gap:6px}
.rulechip{max-width:100%}
.rc-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:240px}
@media (max-width:1100px){.probs{grid-template-columns:1fr}}
/* эмблема сервиса */
.emb{display:inline-grid;place-items:center;background:transparent;flex:none}
.emb .emb-svg{width:100%;height:100%;display:block}
.mh-mark.emb{width:32px;height:32px;border-radius:0;background:transparent}
.rail #btn-run{gap:10px;padding:0 12px 0 6px;justify-content:flex-start}

.rail #btn-run .emb-run .emb-svg{width:28px;height:28px}
.app.collapsed .rail #btn-run{width:40px;height:40px;padding:0;justify-content:center;border-radius:9px;margin:0 auto;background:transparent;overflow:hidden}
.app.collapsed .rail #btn-run:hover{background:transparent;filter:brightness(.95)}
.app.collapsed .rail #btn-run:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app.collapsed .rail #btn-run .emb-run{width:40px;height:40px;background:transparent}
.app.collapsed .rail #btn-run .emb-run .emb-svg{width:40px;height:40px}
.rail #btn-run:disabled{opacity:.6}
@media (prefers-reduced-motion:no-preference){.rail #btn-run.running .emb-svg{animation:embPulse 1s ease-in-out infinite}}
@keyframes embPulse{50%{transform:scale(.82)}}
/* кнопка проверки в развёрнутом меню: подпись в одну строку, иконка насыщеннее */
.rail #btn-run{font-size:13px;white-space:nowrap;gap:8px;padding:0 10px 0 6px}
.rail #btn-run .lbl{overflow:hidden;text-overflow:ellipsis}
.rail #btn-run .emb-run{width:28px;height:28px;border-radius:7px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.35)}
/* свёрнутое меню: та же насыщенная иконка, с рамкой */
.app.collapsed .rail #btn-run .emb-run{width:40px;height:40px;border-radius:10px;box-shadow:none}
.app.collapsed .rail #btn-run{box-shadow:0 0 0 1.5px #479C80,0 2px 6px rgba(11,31,51,.14)}
.app.collapsed .rail #btn-run:hover{box-shadow:0 0 0 2px #3A7F65,0 2px 8px rgba(11,31,51,.18)}
/* v40: логотип «НВОС · ПРОВЕРКА» — «О» в виде лупы; лупа же на кнопке запуска */
.wm{display:inline-flex;flex-direction:column;align-items:flex-start;line-height:1;user-select:none}
.wm-t{display:inline-flex;align-items:center;font-size:21px;font-weight:800;letter-spacing:.01em;color:var(--fg)}
.wm-o{display:inline-block;width:25px;height:25px;margin:0 0 0 1px;transform:translateY(1px)}
.wm-o .emb-svg{width:100%;height:100%;display:block;overflow:visible}
.wm-s{margin-top:3px;font-size:8.5px;font-weight:600;letter-spacing:.42em;color:var(--muted,#718096);padding-left:1px}
.rail #btn-run .emb-run{background:#fff;border-radius:7px;box-shadow:none}
.rail #btn-run .emb-run .emb-svg{width:22px;height:22px}
.app.collapsed .rail #btn-run{background:#fff}
.app.collapsed .rail #btn-run:hover{background:#F3FAF7;filter:none}
.app.collapsed .rail #btn-run .emb-run{background:transparent}
.app.collapsed .rail #btn-run .emb-run .emb-svg{width:30px;height:30px}
/* v41: предупреждения — янтарно-жёлтые и треугольником, чтобы не путать с ошибками */
.psev.w,.kpi .lbl i.tri{border-radius:0;clip-path:polygon(50% 0,100% 100%,0 100%);width:10px;height:9px}
.ftbl tr.warning td.sev::before{border-radius:0;clip-path:polygon(50% 0,100% 100%,0 100%);width:8px;height:7px;background:var(--warn-fill)}
.cnt-w::before,.pill.warnp::before{content:"";display:inline-block;width:7px;height:6px;margin-right:4px;vertical-align:1px;background:currentColor;clip-path:polygon(50% 0,100% 100%,0 100%)}
.prob .bar i.w{background:var(--warn-fill)}
@media (max-width:900px){
  .mh{gap:12px;padding:0 12px}
  .mh-priv,.mh-crumb{display:none}

  .main{padding:16px 16px 48px}
  .app.collapsed .rail{display:none}
}

<script>
/* =====================================================================
   1. СПРАВОЧНИКИ
   ===================================================================== */
const IMPACTS = [
  { id: 'air',   label: 'Выбросы', gen: 'выброса', src: 'выброс' },
  { id: 'water', label: 'Сбросы',  gen: 'сброса',  src: 'сброс'  },

const CATEGORIES = [
  { id: 'I',   label: 'I категория',   docs: [], stub: true },
  { id: 'II',  label: 'II категория',  docs: ['DPNVOS', 'ONVOS', 'DVOS'], params: true },
  { id: 'III', label: 'III категория', docs: ['DPNVOS', 'ONVOS', 'PEK'] },

/* Поля документов. aliases — фрагменты заголовка для автосопоставления (регистр, пробелы и знаки не важны).
   Поля перебираются по порядку, столбец занимается первым подходящим полем. */
/* col — столбец по умолчанию (0 = A), если заголовок не распознан по названию */
const fld = (key, label, aliases, required = false, col = null) => ({ key, label, aliases, required, col });
const DOC_TYPES = {
  DPNVOS: { short: 'ДПНВОС', title: 'Декларация о плате за НВОС', fields: [
    fld('reportNo',  'Номер отчёта', ['номер отчета'], true),

    fld('status',    'Статус отчёта', ['статус отчета']),
    fld('inn',       'ИНН', ['инн'], true),
    fld('orgName',   'Наименование организации', ['наименование организации']),
    fld('objectCode','Код объекта НВОС', ['код объекта нвос', 'код объекта', 'код онвос'], true),
    fld('objectName','Наименование объекта', ['наименование объекта нвос', 'наименование объекта']),
    fld('category',  'Категория объекта', ['категория объекта']),
    fld('zvCode',    'Код ЗВ', ['код зв', 'код загрязняющ', 'код вещества'], true),
    fld('zvName',    'Наименование ЗВ', ['наименование зв', 'загрязняющее вещество', 'наименование вещества']),
    fld('mass',      'Масса для сверки (НДВ/НДС), т', ['фактический выброс зв ндв', 'фактический сброс зв ндс', 'ндв тн', 'ндс'], true),
    fld('massTotal', 'Фактический выброс/сброс всего (V), т', ['фактический выброс зв всего', 'фактический сброс зв всего'], false, 21),
    fld('massVrv',   'В пределах ВРВ/ВРС, т', ['фактический выброс зв в пределах врв', 'фактический сброс зв в пределах врс', 'в пределах врв', 'в пределах врс']),
    fld('massOver',  'Сверх лимита, т', ['фактический выброс сверх', 'фактический сброс сверх']),
    fld('section',   'Раздел / вид воздействия', ['раздел', 'вид воздействия', 'тип воздействия']),

document.addEventListener('change', async e => {
  const el = e.target, act = el.dataset?.act, d = el.dataset?.doc;
  if (el.id === 'flt-sev') { state.filter.sev = el.value; renderTable(); return; }
  if (el.id === 'flt-bad') { state.filter.onlyBad = el.checked; renderTable(); return; }
  if (el.id === 'flt-line') { state.filter.line = el.value; renderTable(); return; }
  if (el.id === 'flt-grp') { state.filter.grp = el.value; renderTable(); return; }
  if (el.id === 'p-year') { SETTINGS.year = +el.value; SETTINGS.yearAuto = false; touchDoc(); renderParams(); renderReport(); return; }
  if (el.id === 'p-tol') { const v = num(el.value); if (v == null || v < 0) { toast('Допуск — неотрицательное число, например 0,000001'); el.value = SETTINGS.tol; return; } SETTINGS.tol = v; touchDoc(); renderReport(); return; }

  const s = slotOf(d); if (!s || s.loading) return;

    else if (act === 'hdr') { s.headerRow = Math.min(29, Math.max(0, (parseInt(el.value, 10) || 1) - 1)); s.headers = headersOf(s); s.map = automap(d, s.headers); }

/* ---------- поиск в верхней строке: подсказки по мере ввода, Enter / «Найти» ---------- */
let gqT = null;
function searchDecls(q) {
  const R = state.result; q = String(q || '').trim().toLowerCase(); if (!R || !q) return [];
  const digits = /^\d+$/.test(q);
  const score = d => {
    if (norm(d.no).toLowerCase() === q || d.inns.includes(q)) return 0;
    if (digits && (String(d.no).startsWith(q) || d.inns.some(i => i.startsWith(q)))) return 1;
    if ([d.no, d.inns.join(' '), d.orgs.join(' ')].join(' ').toLowerCase().includes(q)) return 2;
    return -1;
  };
  return R.decls.map(d => [score(d), d]).filter(x => x[0] >= 0).sort((a, b) => a[0] - b[0] || b[1].errors - a[1].errors).map(x => x[1]);
}
const hl = (t, q) => { const s = String(t ?? ''), i = q ? s.toLowerCase().indexOf(q.toLowerCase()) : -1; return i < 0 ? esc(s) : esc(s.slice(0, i)) + '<mark>' + esc(s.slice(i, i + q.length)) + '</mark>' + esc(s.slice(i + q.length)); };
function renderSearchResults() {
  const inp = $('#g-q'), box = $('#g-res'); if (!inp || !box) return;
  const q = inp.value.trim();

  const list = searchDecls(q), shown = list.slice(0, 8);
  let html = '';
  if (list.length) {
    html = `<div class="gh">Найдено деклараций: ${list.length.toLocaleString('ru-RU')}</div>` + shown.map(d => `<button type="button" class="gr" data-act="g-open" data-id="${esc(d.no)}">
      <span class="wi"><span class="no">№ ${hl(d.no, q)}</span><span class="org">${hl(d.orgs.join('; ') || 'организация не указана', q)} · ИНН ${hl(d.inns.join(', '), q)}</span></span>
      <span class="ct">${d.errors ? `<span class="cnt-e">${d.errors}</span>` : ''}${d.warnings ? `<span class="cnt-w">${d.warnings}</span>` : ''}${!d.errors && !d.warnings ? '<span class="cnt-ok">✓</span>' : ''}</span></button>`).join('')
      + (list.length > 1 ? `<button type="button" class="gall" data-act="g-all">Показать все ${list.length.toLocaleString('ru-RU')} в списке →</button>` : '');
  } else {

    html = `<div class="gnone">По «${esc(q)}» деклараций за ${state.result.settings.year} год не найдено.</div>`

function hideSearchResults() { const b = $('#g-res'); if (b) b.hidden = true; $('#g-q')?.setAttribute('aria-expanded', 'false'); }

function openFound(no) {

    state.rule = ''; state.wsf = 'all'; SETTINGS.decl = no; state.cat = 'all';

/* применить запрос к списку */
function applySearch() {
  const inp = $('#g-q'); if (!inp) return;
  const q = inp.value.trim(); state.listQ = q;
  const list = searchDecls(q);
  if (q && list.length === 1) return openFound(list[0].no);
  hideSearchResults();
  if (!q) { renderReport(); return; }
  if (!list.length) { renderSearchResults(); return; }
  if (state.page === 'summary') {
    state.rule = ''; state.wsf = 'all'; SETTINGS.decl = list[0].no; renderSummary(state.result);
    document.querySelector('.ws')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  } else { if (state.page !== 'decls') { state.page = 'decls'; renderNav(); } renderReport(); }
  toast(`Найдено деклараций: ${list.length.toLocaleString('ru-RU')}`);
}
/* «Показать все в списке»: список в рабочем месте (сводка) или таблица «Декларации» */

document.addEventListener('keydown', e => {

  if (e.target.closest?.('#g-res') && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
    e.preventDefault(); const it = [...document.querySelectorAll('#g-res .gr, #g-res .gall')], k = it.indexOf(e.target);
    if (e.key === 'ArrowUp' && k <= 0) $('#g-q').focus(); else it[Math.min(it.length - 1, k + (e.key === 'ArrowDown' ? 1 : -1))]?.focus();
